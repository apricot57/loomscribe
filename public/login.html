<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — LoomScribe</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">

    <!-- Match the theme the user last selected in the main app -->
    <script>
        (function() {
            const validThemes = ['cyan', 'teal', 'purple', 'amber', 'slate'];
            const saved = localStorage.getItem('ls_theme');
            const theme = validThemes.includes(saved) ? saved : 'cyan';
            document.documentElement.classList.add('theme-' + theme);
        })();
    </script>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L6 12C6 15 9 18 9 22H15C15 18 18 15 18 12L12 2Z" />
                    <line x1="12" y1="2" x2="12" y2="11" />
                    <circle cx="12" cy="11" r="1" />
                </svg>
            </div>
            <span class="brand-name">LoomScribe</span>
        </div>

        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Enter your workspace password to continue.</p>
        </div>

        <div class="error-alert" id="error-alert" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="error-text">Incorrect password.</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="password">Workspace Password</label>
                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••••••"
                        required
                        autofocus
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="btn-text">Sign In</span>
                <span class="spinner"></span>
            </button>
        </form>

        <p class="footer-note">LoomScribe Prompt Engine Workspace</p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const errorAlert = document.getElementById('error-alert');
        const errorText = document.getElementById('error-text');

        function showError(msg) {
            errorText.textContent = msg;
            errorAlert.classList.add('visible');
            passwordInput.focus();
        }

        function hideError() {
            errorAlert.classList.remove('visible');
        }

        passwordInput.addEventListener('input', hideError);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const password = passwordInput.value.trim();
            if (!password) return;

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('ls_auth_token', data.token);
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Invalid password. Please try again.');
                    passwordInput.value = '';
                }
            } catch (err) {
                showError('Could not reach the server. Please verify connection.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
